<body>
    <center><h1>Мұхтар Әуезов</h1></center>
    <center><p>1897-1961</p></center>
    <hr>
    <center><h2>Өмірі</h2></center>
    <p>1897 жылы <b>Шыңғыстау</b> бөктерінде дүниеге келді. Қазақтың ұлы жазушысы,драматург,ғалым.</p>
    <h2>Шығармалары</h2>
    <p><u>Абай жолы</u> - төрт томдық роман-эпопия.</p>
    <p>Пьесалары: "Еңлік-Кебек" "Қаракөз".</p>
    <hr>
    <p><b>1959 жыллы</b>  Абай жолы үшін Лениндік сыйлық алған.</p>
</body>
